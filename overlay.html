<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Delta Force Streamer Ladder S2 - OBS Overlay</title>
<!-- 設定請改同資料夾的 config.js -->
<style>
  :root {
    --accent: #0ff796;      /* Delta Force 官方綠 */
    --up: #0ff796;
    --gold: #f4cf67;        /* 官方金 */
    --silver: #d7dde2;
    --bronze: #e0995e;
    --tier: var(--accent);  /* 目前名次用的顏色（前三名會換成金 / 銀 / 銅） */
    --down: #ff5c5c;
    --text: #ffffff;
    --muted: rgba(255,255,255,.72);
    --card: rgba(15, 25, 27, .80); /* 官方頁面的深藍綠底 */
    --justify: center;
    --origin: center center;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex;
    align-items: center;            /* 上下置中 */
    justify-content: var(--justify); /* 左 / 中 / 右 */
    font-family: "Segoe UI", "Microsoft JhengHei", "Microsoft YaHei", "Yu Gothic UI", "Malgun Gothic", "Leelawadee UI", "Noto Sans", sans-serif;
    color: var(--text);
    text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6);
  }
  /* 依語言挑字型，讓中日韓漢字用各自地區的字形 */
  :lang(zh-TW) body { font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", "Yu Gothic UI", "Malgun Gothic", "Leelawadee UI", sans-serif; }
  :lang(zh-CN) body { font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans SC", "Yu Gothic UI", "Malgun Gothic", "Leelawadee UI", sans-serif; }
  :lang(ja) body    { font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", "Noto Sans JP", "Microsoft JhengHei", "Malgun Gothic", "Leelawadee UI", sans-serif; }
  :lang(ko) body    { font-family: "Segoe UI", "Malgun Gothic", "Noto Sans KR", "Yu Gothic UI", "Microsoft JhengHei", "Leelawadee UI", sans-serif; }
  :lang(th) body    { font-family: "Leelawadee UI", "Segoe UI", "Noto Sans Thai", "Microsoft JhengHei", "Yu Gothic UI", "Malgun Gothic", sans-serif; }
  :lang(ar) body    { font-family: "Segoe UI", "Noto Sans Arabic", "Microsoft JhengHei", "Yu Gothic UI", "Malgun Gothic", sans-serif; }
  #card {
    display: inline-flex;
    flex-direction: column;
    gap: 6px;
    min-width: 340px;
    max-width: 380px;   /* 長標題（例如葡萄牙文）會換行，不會撐出 OBS 來源框 */
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--card);
    border-inline-start: 4px solid var(--tier); /* 阿拉伯文（由右到左）時會自動換到右邊 */
    transform-origin: var(--origin);
  }
  body.nobg #card { background: transparent; border-inline-start-color: transparent; }

  .top { display: flex; align-items: center; gap: 12px; }
  #avatar {
    width: 52px; height: 52px; border-radius: 50%;
    object-fit: cover; border: 2px solid var(--tier);
    background: #222; flex: none;
  }
  body.noavatar #avatar { display: none; }
  .top > div { min-width: 0; }
  .title { overflow-wrap: break-word; line-height: 1.3; font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 700; text-transform: uppercase; }
  /* 暱稱太長時用「…」截斷，不會超出卡片 */
  #name { font-size: 20px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .main { display: flex; align-items: baseline; gap: 16px; }
  .rankbox { display: flex; align-items: baseline; gap: 6px; }
  #rank { font-size: 46px; font-weight: 800; line-height: 1; color: var(--tier); display: inline-block; }
  #medal { font-size: 26px; line-height: 1; align-self: center; display: none; }

  /* ---------- 前三名：金 / 銀 / 銅 ---------- */
  /* 只有開啟前三名特效（topEffects）時才換色，關掉就全部維持官方綠 */
  body.top-fx[data-tier="1"] { --tier: var(--gold); }
  body.top-fx[data-tier="2"] { --tier: var(--silver); }
  body.top-fx[data-tier="3"] { --tier: var(--bronze); }
  body.top-fx[data-tier] #medal { display: inline-block; }
  body.top-fx[data-tier] #rank {
    /* 金屬漸層字（舊版瀏覽器不支援 color-mix 時會退回單色） */
    background: var(--tier);
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--tier) 35%, #fff) 0%,
      var(--tier) 50%,
      color-mix(in srgb, var(--tier) 65%, #000) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.9)) drop-shadow(0 0 8px color-mix(in srgb, var(--tier) 55%, transparent));
  }
  body.top-fx[data-tier] #card { box-shadow: 0 0 14px color-mix(in srgb, var(--tier) 35%, transparent); }
  body.nobg.top-fx[data-tier] #card { box-shadow: none; }
  /* 第 1 名：一道光緩緩掃過數字 */
  @keyframes shine { 0% { background-position: 150% 0; } 60%, 100% { background-position: -50% 0; } }
  body.top-fx[data-tier="1"] #rank {
    background: linear-gradient(100deg,
      transparent 35%, rgba(255,255,255,.85) 50%, transparent 65%) 150% 0 / 250% 100% no-repeat,
      linear-gradient(180deg,
      color-mix(in srgb, var(--tier) 35%, #fff) 0%,
      var(--tier) 50%,
      color-mix(in srgb, var(--tier) 65%, #000) 100%);
    -webkit-background-clip: text; background-clip: text;
    animation: shine 4s ease-in-out infinite;
  }
  body.top-fx[data-tier="1"] #rank.pop { animation: pop .9s ease-out, shine 4s ease-in-out infinite; }
  #total { font-size: 15px; color: var(--muted); }
  #change { font-size: 18px; font-weight: 800; min-width: 1em; }
  #change.up { color: var(--up); }
  #change.down { color: var(--down); }
  .scorebox { display: flex; flex-direction: column; }
  .label { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  #score { font-size: 24px; font-weight: 700; line-height: 1.1; }

  .gaps { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
  .gaps .row { display: flex; gap: 6px; white-space: nowrap; align-items: baseline; }
  .gaps .row:empty { display: none; }
  .gaps .who { color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .gaps .val { font-weight: 700; }
  .gaps .behind { color: var(--down); }
  .gaps .ahead { color: var(--up); }
  .gaps .first { color: var(--tier); }
  .gaps .tie { color: var(--muted); }
  body.nogaps .gaps { display: none; }

  /* 地區排名：名次下方的一行小字 */
  #regionRank { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: -4px; }
  #regionRank:empty, body.noregion #regionRank { display: none; }

  /* 數字（名次、分數、差距）不管什麼語言都由左到右顯示 */
  .rankbox, #score, .gaps .val, #stats b { direction: ltr; unicode-bidi: isolate; }

  #stats { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
  #stats b { color: var(--text); }
  body.nostats #stats { display: none; }

  #status { font-size: 11px; color: var(--muted); }
  #status:empty { display: none; }
  #status.err { color: var(--down); }

  /* 名次變動動畫 */
  @keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes flashUp { 0%,100% { background: var(--card); } 30% { background: rgba(15,247,150,.40); } }
  @keyframes flashDown { 0%,100% { background: var(--card); } 30% { background: rgba(255,92,92,.45); } }
  #rank.pop { animation: pop .9s ease-out; display: inline-block; }
  #card.flash-up { animation: flashUp 1.8s ease-out; }
  #card.flash-down { animation: flashDown 1.8s ease-out; }
  body.nobg #card.flash-up, body.nobg #card.flash-down { animation: none; }
</style>
</head>
<body>
  <div id="card">

      <div>
        <div class="title" id="title"></div>

    </div>

    <div id="stats"></div>
    <div id="status"></div>

  // 官網各語系的地區名稱（key = API 回傳的 region 代碼）
  const REGION_NAMES = {
    'ar': { 'AMERICA': 'أمريكا', 'WESTERN EUROPE': 'أوروبا الغربية', 'EASTERN EUROPE': 'أوروبا الشرقية', 'JAPAN AND SOUTH KOREA': 'اليابان وكوريا الجنوبية', 'PAN-PACIFIC': 'منطقة المحيط الهادئ', 'OTHERS': 'أخرى' },
    'de': { 'AMERICA': 'Amerika', 'WESTERN EUROPE': 'Westeuropa', 'EASTERN EUROPE': 'Osteuropa', 'JAPAN AND SOUTH KOREA': 'Japan und Südkorea', 'PAN-PACIFIC': 'Pan-Pazifik', 'OTHERS': 'Sonstiges' },
    'en': { 'AMERICA': 'AMERICA', 'WESTERN EUROPE': 'WESTERN EUROPE', 'EASTERN EUROPE': 'EASTERN EUROPE', 'JAPAN AND SOUTH KOREA': 'JAPAN AND SOUTH KOREA', 'PAN-PACIFIC': 'PAN-PACIFIC', 'OTHERS': 'OTHER' },
    'es': { 'AMERICA': 'América', 'WESTERN EUROPE': 'Europa Occidental', 'EASTERN EUROPE': 'Europa Oriental', 'JAPAN AND SOUTH KOREA': 'Japón y Corea del Sur', 'PAN-PACIFIC': 'Pan-Pacífico', 'OTHERS': 'Otro' },
    'fr': { 'AMERICA': 'Amérique', 'WESTERN EUROPE': 'Europe de l\'Ouest', 'EASTERN EUROPE': 'Europe de l\'Est', 'JAPAN AND SOUTH KOREA': 'Japon et Corée du Sud', 'PAN-PACIFIC': 'Pan-Pacifique', 'OTHERS': 'Autres' },
    'id': { 'AMERICA': 'AMERIKA', 'WESTERN EUROPE': 'EROPA BARAT', 'EASTERN EUROPE': 'EROPA TIMUR', 'JAPAN AND SOUTH KOREA': 'JEPANG DAN KOREA SELATAN', 'PAN-PACIFIC': 'PAN-PASIFIK', 'OTHERS': 'LAINNYA' },
    'ja': { 'AMERICA': 'アメリカ', 'WESTERN EUROPE': '西ヨーロッパ', 'EASTERN EUROPE': '東ヨーロッパ', 'JAPAN AND SOUTH KOREA': '日本と韓国', 'PAN-PACIFIC': '環太平洋', 'OTHERS': 'その他' },
    'ko': { 'AMERICA': '아메리카', 'WESTERN EUROPE': '서유럽', 'EASTERN EUROPE': '동유럽', 'JAPAN AND SOUTH KOREA': '일본과 한국', 'PAN-PACIFIC': '환태평양', 'OTHERS': '기타' },
    'ms': { 'AMERICA': 'AMERIKA', 'WESTERN EUROPE': 'EROPAH BARAT', 'EASTERN EUROPE': 'EROPAH TIMUR', 'JAPAN AND SOUTH KOREA': 'JEPUN DAN KOREA SELATAN', 'PAN-PACIFIC': 'PAN-PASIFIK', 'OTHERS': 'LAIN' },
    'pt': { 'AMERICA': 'América', 'WESTERN EUROPE': 'Europa Ocidental', 'EASTERN EUROPE': 'Europa Oriental', 'JAPAN AND SOUTH KOREA': 'Japão e Coreia do Sul', 'PAN-PACIFIC': 'Pan-Pacífico', 'OTHERS': 'Outro' },
    'ru': { 'AMERICA': 'Америка', 'WESTERN EUROPE': 'Западная Европа', 'EASTERN EUROPE': 'Восточная Европа', 'JAPAN AND SOUTH KOREA': 'Япония и Южная Корея', 'PAN-PACIFIC': 'Пан-Тихоокеанский регион', 'OTHERS': 'Другое' },
    'th': { 'AMERICA': 'อเมริกา', 'WESTERN EUROPE': 'ยุโรปตะวันตก', 'EASTERN EUROPE': 'ยุโรปตะวันออก', 'JAPAN AND SOUTH KOREA': 'ญี่ปุ่นและเกาหลีใต้', 'PAN-PACIFIC': 'ภูมิภาคแปซิฟิก', 'OTHERS': 'อื่นๆ' },
    'tr': { 'AMERICA': 'Amerika', 'WESTERN EUROPE': 'Batı Avrupa', 'EASTERN EUROPE': 'Doğu Avrupa', 'JAPAN AND SOUTH KOREA': 'Japonya ve Güney Kore', 'PAN-PACIFIC': 'Pan-Pasifik', 'OTHERS': 'Diğer' },
    'vi': { 'AMERICA': 'CHÂU MỸ', 'WESTERN EUROPE': 'TÂY CHÂU ÂU', 'EASTERN EUROPE': 'ĐÔNG CHÂU ÂU', 'JAPAN AND SOUTH KOREA': 'NHẬT BẢN VÀ HÀN QUỐC', 'PAN-PACIFIC': 'TOÀN THÁI BÌNH DƯƠNG', 'OTHERS': 'KHÁC' },
    'zh-CN': { 'AMERICA': '美洲', 'WESTERN EUROPE': '西欧', 'EASTERN EUROPE': '东欧', 'JAPAN AND SOUTH KOREA': '日本与韩国', 'PAN-PACIFIC': '泛太平洋', 'OTHERS': '其他' },
    'zh-TW': { 'AMERICA': '美洲', 'WESTERN EUROPE': '西歐', 'EASTERN EUROPE': '東歐', 'JAPAN AND SOUTH KOREA': '日本與韓國', 'PAN-PACIFIC': '泛太平洋', 'OTHERS': '其他' },
  };

  // 把 config 的 language 對應到上面的語言代碼；"auto" 時跟著系統 / OBS 語言
  function resolveLang(pref) {
    const pick = tag => {
      if (!tag) return null;
      const t = String(tag).replace('_', '-').toLowerCase();
      if (t === 'zh-tw' || t === 'zh-hk' || t === 'zh-mo' || t.startsWith('zh-hant')) return 'zh-TW';
      if (t.startsWith('zh')) return 'zh-CN';
      const base = t.split('-')[0];
      return I18N[base] ? base : null;
    };
    if (pref && String(pref).toLowerCase() !== 'auto') return pick(pref) || 'en';
    for (const l of (navigator.languages || [navigator.language])) { const p = pick(l); if (p) return p; }
    return 'en';
  }

  let LANG = 'en';
  // 數字格式：阿拉伯文也用 0-9，方便觀眾閱讀
  const locale = () => (LANG === 'ar' ? 'ar-u-nu-latn' : LANG);
  function t(key, vars = {}) {
    const s = (CFG.text && CFG.text[key]) ?? I18N[LANG]?.[key] ?? I18N.en[key] ?? key;
    return String(s).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  }

  // 網址參數可以蓋過 config.js（進階用，例如 overlay.html?player=xxx&scale=1.5）
  const qs = new URLSearchParams(location.search);
  function urlOverrides() {
    const o = {};
    const bool = v => !['0', 'false', 'no', 'off'].includes(String(v).toLowerCase());
    if (qs.has('player')) o.player = qs.get('player');
    if (qs.has('name')) o.player = qs.get('name');
    if (qs.has('lang')) o.language = qs.get('lang');
    if (qs.has('interval')) o.interval = Number(qs.get('interval'));
    if (qs.has('align')) o.align = qs.get('align');
    if (qs.has('scale')) o.scale = Number(qs.get('scale'));
    if (qs.has('bg')) o.background = bool(qs.get('bg'));
    if (qs.has('avatar')) o.showAvatar = bool(qs.get('avatar'));
    if (qs.has('stats')) o.showStats = bool(qs.get('stats'));
    if (qs.has('gaps')) o.showGaps = bool(qs.get('gaps'));
    return o;
  }

  // settings.html 的預覽會用 ?cfg={...JSON...} 傳設定進來（只當資料解析，不會執行）
  const CFG_KEYS = Object.keys(DEFAULTS);
  function cfgParam() {
    if (!qs.has('cfg')) return {};
    try {
      const o = JSON.parse(qs.get('cfg'));
      if (!o || typeof o !== 'object' || Array.isArray(o)) return {};
      return Object.fromEntries(Object.entries(o).filter(([k]) => CFG_KEYS.includes(k)));
    } catch (e) { return {}; }
  }
  // ?demo=1 / 2 / 3 / 25 …：用假資料預覽某個名次的樣子，不連官方伺服器
  const DEMO_RANK = qs.has('demo') ? Math.max(1, parseInt(qs.get('demo'), 10) || 25) : 0;

  let CFG = { ...DEFAULTS };
  let configState = 'ok';   // 'ok' | 'missing'（找不到檔案）| 'broken'（檔案有錯）
  let lastGoodConfig = {};  // 最後一次正確讀到的設定，檔案改壞時沿用這份

  // 每次更新前重新讀 config.js，所以改設定不用重開 OBS
  function loadConfig() {
    return new Promise(resolve => {
      document.getElementById('cfgScript')?.remove();
      // 先清掉舊設定：檔案有語法錯誤時不會重新賦值，這樣才分得出來
      window.OVERLAY_CONFIG = undefined;
      const s = document.createElement('script');
      s.id = 'cfgScript';
      s.src = 'config.js?t=' + Date.now();
      s.onload = () => {
        const c = window.OVERLAY_CONFIG;
        if (c && typeof c === 'object' && !Array.isArray(c)) {
          configState = 'ok';
          lastGoodConfig = c;
        } else {
          configState = 'broken';  // 語法錯誤或沒有定義 OVERLAY_CONFIG
        }
        resolve(lastGoodConfig);
      };
      s.onerror = () => { configState = 'missing'; resolve(lastGoodConfig); };
      document.head.appendChild(s);
    });
  }

  function applyConfig(fileCfg) {
    const prevPlayer = CFG.player;
    CFG = { ...DEFAULTS, ...fileCfg, ...cfgParam(), ...urlOverrides() };
    CFG.interval = Math.max(30, Number(CFG.interval) || 60);
    CFG.scale = Number(CFG.scale) || 1;
    CFG.player = String(CFG.player || '').trim();

    const root = document.documentElement.style;
    const align = String(CFG.align).toLowerCase();
    root.setProperty('--justify', align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center');
    root.setProperty('--origin', align === 'left' ? 'left center' : align === 'right' ? 'right center' : 'center center');
    // 顏色固定使用 Delta Force 官方配色（見最上面的 CSS 變數），不開放設定
    document.body.classList.toggle('top-fx', CFG.topEffects !== false);
    $('card').style.transform = CFG.scale !== 1 ? `scale(${CFG.scale})` : '';
    document.body.classList.toggle('nobg', !CFG.background);
    document.body.classList.toggle('noavatar', !CFG.showAvatar);
    document.body.classList.toggle('nostats', !CFG.showStats);
    document.body.classList.toggle('nogaps', !CFG.showGaps);
    document.body.classList.toggle('noregion', CFG.showRegion === false);

    LANG = resolveLang(CFG.language);
    document.documentElement.lang = LANG;
    document.documentElement.dir = RTL.includes(LANG) ? 'rtl' : 'ltr';
    $('ratingLabel').textContent = t('rating');
    // 標題：沒設定（或還是舊版預設的 "Streamer Ladder S2"）就用官網各語系的活動名稱
    const customTitle = String(CFG.title ?? '').trim();
    // 「Delta Force」中間用不換行空白，標題太長時整個詞一起換到下一行
    $('title').textContent = (customTitle && customTitle !== 'Streamer Ladder S2' ? customTitle : t('title'))
      .replace(/Delta Force/gi, m => m.replace(' ', '\u00A0'));
    if (!lastOkAt && $('name').textContent === '…') $('name').textContent = t('loading');

    if (prevPlayer !== CFG.player) { prevRank = loadPrevRank(); lastChange = { dir: '', diff: 0 }; }
  }

  // ---------- 官方排名介面（活動頁本身用的，每分鐘更新） ----------
  const API = 'https://sg-apps.vasdgame.com/ide/';
  const BODY = new URLSearchParams({
    iChartId: '100017209',
    sIdeToken: 'IKJtRZ',
    instanceid: '4012871',
    method: 'streamer.rank',
    from_source: '2',
    param: JSON.stringify({ loginType: 0, streamerType: 0, seasonId: 'default' }),
  }).toString();

  const $ = id => document.getElementById(id);
  const fmt = n => Number(n || 0).toLocaleString(locale());
  // 大數字依語言縮寫：中文 4,410萬、日文 4410万、韓文 4410만、英文 44M …
  const fmtBig = n => {
    try { return new Intl.NumberFormat(locale(), { notation: 'compact', maximumFractionDigits: 1 }).format(Number(n || 0)); }
    catch (e) { return fmt(n); }
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // 記住上一次的名次，用來顯示 ▲▼
  const storeKey = () => 'dfLadderPrevRank:' + CFG.player.toLowerCase();
  function loadPrevRank() { try { return Number(localStorage.getItem(storeKey())) || null; } catch (e) { return null; } }
  let prevRank = null;
  let lastChange = { dir: '', diff: 0 };
  let lastOkAt = 0;

  const FETCH_TIMEOUT_MS = 15000;
  function demoList() {
    const me = CFG.player || 'Streamer';
    const list = [];
    for (let r = Math.max(1, DEMO_RANK - 1); r <= DEMO_RANK + 1; r++) {
      list.push({ rank: r, gopenid: 'demo' + r, nickname: r === DEMO_RANK ? me : 'Player' + r, avatar: '',
                  region: 'PAN-PACIFIC', _regionRank: Math.max(1, Math.ceil(r / 3)),
                  eloScore: 6000 - r * 13, killCnt: 88, matchCnt: 30, carryOutValue: 12500000 });
    }
    return { list, total: 136 };
  }

  async function fetchList() {
    if (DEMO_RANK) return demoList();
    // 官方伺服器沒回應時 15 秒就放棄，避免整個更新卡住
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
    let res;
    try {
      res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: BODY,
        cache: 'no-store',
        signal: ctrl.signal,
      });
    } finally {
      clearTimeout(timer);
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const d = j?.jData?.data;
    if (j.iRet !== 0 || !d || d.code !== 0) throw new Error('API 回傳錯誤：' + (j.sMsg || d?.msg || 'unknown'));
    if (!Array.isArray(d.data?.list)) throw new Error('API 回傳格式不對');
    return d.data; // { list, total }
  }

  // 分數差距：負的 = 落後（紅）、正的 = 領先（綠）、0 = 同分（灰）
  function gapHtml(diff) {
    diff = Number(diff) || 0;
    if (diff === 0) return '<span class="val tie">±0</span>';
    const cls = diff < 0 ? 'behind' : 'ahead';
    return `<span class="val ${cls}">${diff < 0 ? '-' : '+'}${fmt(Math.abs(diff))}</span>`;
  }

  // 頭像：沒有或載入失敗時只留空的圓框，不出現破圖示
  function setAvatar(url) {
    const img = $('avatar');
    if (!url) { img.removeAttribute('src'); return; }
    if (img.getAttribute('src') !== url) img.src = url;
  }

  function findMe(list) {
    const p = CFG.player || (DEMO_RANK ? 'Streamer' : ''), pl = p.toLowerCase();
    if (!p) return null;
    return list.find(x => String(x.gopenid) === p)
        || list.find(x => x.nickname === p)
        || list.find(x => String(x.nickname).toLowerCase() === pl);
  }

  function render({ list, total }) {
    list = [...list].sort((a, b) => a.rank - b.rank);
    const me = findMe(list);
    if (!me) {
      $('name').textContent = CFG.player || '—';
      setAvatar('');
      $('rank').textContent = '#--';
      delete document.body.dataset.tier;
      $('medal').textContent = '';
      $('regionRank').textContent = '';
      $('score').textContent = '--';
      $('aboveRow').innerHTML = $('belowRow').innerHTML = $('stats').innerHTML = '';
      notFoundMsg = CFG.player ? t('notFound', { name: CFG.player }) : t('noPlayer');
      fetchError = '';
      return;
    }
    notFoundMsg = '';
    const i = list.indexOf(me);
    const above = list[i - 1], below = list[i + 1];

    $('name').textContent = me.nickname;
    setAvatar(me.avatar);
    $('rank').textContent = '#' + me.rank;
    // 前三名換顏色 + 獎牌
    if (me.rank >= 1 && me.rank <= 3) document.body.dataset.tier = String(me.rank);
    else delete document.body.dataset.tier;
    $('medal').textContent = ['', '🥇', '🥈', '🥉'][me.rank] || '';
    $('total').textContent = '/ ' + (total || list.length);

    // 地區排名：同地區的人照世界名次排序後的順位（官網的地區篩選也是這樣算）。沒有地區就不顯示
    const region = String(me.region || '').trim().toUpperCase();
    if (region) {
      const rr = me._regionRank || (list.filter(p => String(p.region || '').trim().toUpperCase() === region).indexOf(me) + 1);
      const rname = REGION_NAMES[LANG]?.[region] ?? REGION_NAMES.en[region] ?? region;
      $('regionRank').textContent = t('regionRank', { region: rname, r: rr });
    } else {
      $('regionRank').textContent = '';
    }
    $('score').textContent = fmt(me.eloScore);

    if (prevRank && prevRank !== me.rank) {
      const up = me.rank < prevRank;
      lastChange = { dir: up ? 'up' : 'down', diff: Math.abs(prevRank - me.rank) };
      animate(up);
    }
    const ch = $('change');
    ch.className = lastChange.dir;
    ch.textContent = lastChange.dir ? (lastChange.dir === 'up' ? '▲' : '▼') + lastChange.diff : '';
    prevRank = me.rank;
    if (!DEMO_RANK) { try { localStorage.setItem(storeKey(), String(me.rank)); } catch (e) {} }

    $('aboveRow').innerHTML = above
      ? `<span class="label">${esc(t('above', { r: above.rank }))}</span><bdi class="who">${esc(above.nickname)}</bdi>${gapHtml(me.eloScore - above.eloScore)}`
      : `<span class="val first">${esc(t('first'))}</span>`;
    $('belowRow').innerHTML = below
      ? `<span class="label">${esc(t('below', { r: below.rank }))}</span><bdi class="who">${esc(below.nickname)}</bdi>${gapHtml(me.eloScore - below.eloScore)}`
      : '';

    $('stats').innerHTML =
      `<span>${esc(t('kills'))} <b>${fmt(me.killCnt)}</b></span>` +
      `<span>${esc(t('matches'))} <b>${fmt(me.matchCnt)}</b></span>` +
      `<span>${esc(t('value'))} <b>${fmtBig(me.carryOutValue)}</b></span>`;

    lastOkAt = Date.now();
    fetchError = '';
  }

  function animate(up) {
    const r = $('rank'), c = $('card');
    r.classList.remove('pop'); c.classList.remove('flash-up', 'flash-down');
    void r.offsetWidth;
    r.classList.add('pop'); c.classList.add(up ? 'flash-up' : 'flash-down');
  }

  // 設定檔問題和連線問題分開記，兩個都有時一起顯示，不會互相蓋掉
  let fetchError = '';
  let notFoundMsg = '';
  function updateStatus() {
    // settings.html 預覽時設定是從網址帶進來的，資料夾裡的 config.js 狀態跟預覽無關，不顯示
    const showConfigState = !qs.has('cfg');
    const parts = [
      !showConfigState ? '' : configState === 'missing' ? t('noConfig') : configState === 'broken' ? t('badConfig') : '',
      notFoundMsg,
      fetchError,
    ].filter(Boolean);
    const s = $('status');
    s.className = parts.length ? 'err' : '';
    s.textContent = parts.join(' · ');
  }

  async function tick() {
    try {
      applyConfig(await loadConfig());
      render(await fetchList());
    } catch (e) {
      console.error('[DF overlay]', e);
      const ago = lastOkAt ? t('ago', { n: Math.round((Date.now() - lastOkAt) / 60000) }) : '';
      fetchError = t('failed') + ago;
    } finally {
      try { updateStatus(); } catch (e) { console.error('[DF overlay]', e); }
      // 不管上面發生什麼事，都一定排下一次更新
      setTimeout(tick, (Number(CFG.interval) || 60) * 1000);
    }
  }

  prevRank = loadPrevRank();
  tick();
})();
</script>
</body>
</html>
